<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Restablecer acceso | Santa Cecilia</title><link rel="stylesheet" href="/restablecer.css"><script src="/restablecer.js" defer></script></head>
<body><main><p class="marca">SANTA CECILIA</p><h1>Restablece tu acceso</h1><p>Elige una contraseña de al menos 12 caracteres. El enlace se puede usar una sola vez.</p><form id="reset"><label for="password">Nueva contraseña</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><label for="confirm">Repite la contraseña</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="72" required><button type="submit">Guardar contraseña</button></form><p id="estado" role="status" aria-live="polite"></p></main></body></html>
