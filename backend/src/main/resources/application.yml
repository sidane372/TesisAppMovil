spring:
  application:
    name: santa-cecilia-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      '[mail.smtp.auth]': ${SMTP_AUTH:true}
      '[mail.smtp.starttls.enable]': ${SMTP_STARTTLS:true}
      '[mail.smtp.connectiontimeout]': 5000
      '[mail.smtp.timeout]': 5000
      '[mail.smtp.writetimeout]': 5000
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
app:
  access-ttl: PT15M
  refresh-ttl: P30D
  reset-ttl: PT30M
  public-url: ${APP_PUBLIC_URL:}
  mail-from: ${SMTP_FROM:}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    email: ${APP_BOOTSTRAP_EMAIL:}
    password: ${APP_BOOTSTRAP_PASSWORD:}
    nombres: ${APP_BOOTSTRAP_NOMBRES:Administrador}
    apellidos: ${APP_BOOTSTRAP_APELLIDOS:Santa Cecilia}
